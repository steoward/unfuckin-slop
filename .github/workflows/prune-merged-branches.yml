name: Prune merged branches

on:
  push:
    branches: [main]
    paths: [.github/workflows/prune-merged-branches.yml]

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete reviewed and merged heads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          for branch in improve/design-skill-workflow improve/source-fidelity cleanup/source-install; do
            ref="refs/heads/$branch"
            remote=$(git ls-remote --refs origin "$ref")
            if [ -z "$remote" ]; then continue; fi
            pull=$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" \
              -f state=closed -f "head=$owner:$branch" -f base=main \
              --jq 'map(select(.merged_at != null))[0].number // empty')
            test -n "$pull"
            read -r head merge < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$pull" --jq '[.head.sha, .merge_commit_sha] | @tsv')
            git merge-base --is-ancestor "$merge" HEAD
            git push --force-with-lease="$ref:$head" origin ":$ref"
          done
