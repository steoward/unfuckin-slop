name: Rust CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test
        run: cargo test --verbose

      - name: Cargo build release
        run: cargo build --release --verbose

      - name: Package and exercise the standalone skill
        shell: bash
        run: |
          set -eu
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          skill_dir="$RUNNER_TEMP/package/unfuckin-slop"
          "target/release/unfslop$suffix" install --dir "$skill_dir"
          cp LICENSE NOTICE.md "$skill_dir/"
          cd "$RUNNER_TEMP/package"
          "unfuckin-slop/bin/unfslop$suffix" context "review this screenshot" --json > pack.json
          python -c "import json; p = json.load(open('pack.json', encoding='utf-8')); assert p['mode'] == 'critique' and p['cards']"
          tar -czf ../unfuckin-slop.tar.gz unfuckin-slop

      - name: Upload the standalone skill
        uses: actions/upload-artifact@v4
        with:
          name: unfuckin-slop-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/unfuckin-slop.tar.gz
          if-no-files-found: error
