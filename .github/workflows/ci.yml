name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test
        run: cargo test --locked

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install retrieval runtime
        run: python -m pip install numpy scikit-learn

      - name: Install and exercise the skill from source
        shell: bash
        run: |
          set -eu
          suffix=""
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          skill_dir="$RUNNER_TEMP/unfslop-test/unfuckin-slop"
          cargo run --locked --release --bin unfslop -- install --dir "$skill_dir"
          test -f "$skill_dir/bin/unfslop$suffix"
          test ! -e "$skill_dir/bin/slop$suffix"
          packet_test="$PWD/eval/verify_design_packet.py"
          cd "$RUNNER_TEMP/unfslop-test"
          "unfuckin-slop/bin/unfslop$suffix" context "review this screenshot" --json > pack.json
          python -c "import json; p = json.load(open('pack.json', encoding='utf-8')); assert p['mode'] == 'critique' and p['cards']"
          python "$packet_test" "unfuckin-slop/bin/unfslop$suffix"
