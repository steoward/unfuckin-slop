[package]
name = "unfuckin-slop"
version = "1.1.0"
edition = "2021"
rust-version = "1.75"
description = "Autonomous 3D & Kinetic UI Design Engine for Coding Agents: Model-grounded inspiration via EmbeddingGemma 2 motion vectors, Apple-grade physical craft, and deterministic anti-slop floor."
license = "MIT"
repository = "https://github.com/steoward/unfuckin-slop"
build = "build.rs"

[lib]
name = "unfuckin_slop"
path = "src/lib.rs"

[[bin]]
name = "unfuckin-slop"
path = "src/main.rs"

[[bin]]
name = "unfslop"
path = "src/bin/unfslop.rs"

[[bin]]
name = "slop"
path = "src/bin/slop.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
