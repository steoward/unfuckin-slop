[package]
name = "unfuckin-slop"
version = "1.1.0"
edition = "2021"
rust-version = "1.75"
description = "Local UI reference search and design guidance for coding agents."
license = "MIT"
repository = "https://github.com/steoward/unfuckin-slop"
build = "build.rs"

[lib]
name = "unfuckin_slop"
path = "src/lib.rs"

[[bin]]
name = "unfslop"
path = "src/bin/unfslop.rs"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
