[package]
name = "unfuckin-slop"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "Context-diet design knowledge for coding agents: atom cards, on-demand packs, deterministic slop lint, and an inspiration MCP."
license = "MIT"
repository = "https://github.com/steoward/unfuckin-slop"
build = "build.rs"

[lib]
name = "unfuckin_slop"
path = "src/lib.rs"

[[bin]]
name = "unfuckin-slop"
path = "src/main.rs"

[[bin]]
name = "slop"
path = "src/bin/slop.rs"

[[bin]]
name = "slop-mcp"
path = "src/bin/slop_mcp.rs"

[dependencies]
rmcp = { version = "3.9", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }
scraper = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
